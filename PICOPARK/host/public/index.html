<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>HOST PANTALLA PRINCIPAL</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { margin: 0; background: #000; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
    canvas { border: 2px solid #333; background: #111; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  </style>
</head>
<body>

<canvas id="c"></canvas>

<script>
const socket = io();
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = 1200;
canvas.height = 600;

let gamePlayers = {};
let lobbyPlayers = [];
let currentStatus = "lobby";
// Nuevas variables de estado
let isDoorOpen = false;
let coin = { visible: true };
let victorySelection = 0;

const LEVEL_VISUAL = {
  platforms: [
    { x: 600, y: 550, w: 1200, h: 20 },
    { x: 300, y: 420, w: 200, h: 20 },
    { x: 900, y: 420, w: 200, h: 20 },
    { x: 600, y: 300, w: 300, h: 20 }
  ],
  door: { x: 1100, y: 500, w: 50, h: 70 },
  key: { x: 600, y: 150, r: 12 }
};

socket.on("lobbyUpdate", (data) => { lobbyPlayers = data.players || []; });
socket.on("gameStarted", () => { currentStatus = "playing"; });
socket.on("gameStatusUpdate", (status) => { currentStatus = status; });
socket.on("updateVictorySelection", (selection) => {
  victorySelection = selection;
});

socket.on("gameState", (state) => {
  gamePlayers = state.players || {};
  isDoorOpen = state.doorOpen;
  coin = state.coin;
});

function sendStartSignal() {
  if (lobbyPlayers.length < 1) { alert("Se necesitan mínimo 1 jugador conectado"); return; }
  socket.emit("startGame");
}

canvas.addEventListener("click", (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  // Solo mantenemos el click para el START del lobby
  if (currentStatus === "lobby" && x >= 450 && x <= 750 && y >= 450 && y <= 530) {
    sendStartSignal();
  }
  // Se eliminó la lógica de click en "victory" porque ahora se controla desde el celular
});

function drawLobby() {
  ctx.fillStyle = "#0d0d1a";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "white";
  ctx.font = "bold 40px Arial";
  ctx.fillText("PICO PARK - MULTIPLAYER", 50, 70);
  ctx.font = "24px Arial";
  ctx.fillText("Esperando jugadores...", 50, 110);
  ctx.fillText(`Jugadores en sala: ${lobbyPlayers.length}/4`, 50, 160);
  lobbyPlayers.forEach((player, index) => {
    const y = 220 + index * 70;
    ctx.fillStyle = player.color;
    ctx.fillRect(50, y, 45, 45);
    ctx.fillStyle = "white";
    ctx.fillText(player.name, 120, y + 32);
  });
  ctx.fillStyle = lobbyPlayers.length >= 1 ? "#2ecc71" : "#555";
  ctx.fillRect(450, 450, 300, 80);
  ctx.fillStyle = "white";
  ctx.font = "bold 28px Arial";
  ctx.fillText("START GAME", 510, 498);
}

function drawGame() {
  ctx.fillStyle = "#161623";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Puerta dinámica: verde si está abierta, morada si no
  ctx.fillStyle = isDoorOpen ? "#2ecc71" : "#8e44ad";
  ctx.fillRect(LEVEL_VISUAL.door.x - 25, LEVEL_VISUAL.door.y - 35, LEVEL_VISUAL.door.w, LEVEL_VISUAL.door.h);
  ctx.strokeStyle = "#f1c40f"; ctx.lineWidth = 3;
  ctx.strokeRect(LEVEL_VISUAL.door.x - 25, LEVEL_VISUAL.door.y - 35, LEVEL_VISUAL.door.w, LEVEL_VISUAL.door.h);

  // Moneda: solo si coin.visible es true
  if (coin && coin.visible) {
    ctx.beginPath();
    ctx.arc(LEVEL_VISUAL.key.x, LEVEL_VISUAL.key.y, LEVEL_VISUAL.key.r, 0, 2 * Math.PI);
    ctx.fillStyle = "#f1c40f"; ctx.fill(); ctx.closePath();
  }

  ctx.fillStyle = "#4a5568";
  LEVEL_VISUAL.platforms.forEach(p => ctx.fillRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h));

  for (let id in gamePlayers) {
    const p = gamePlayers[id];
    ctx.fillStyle = p.color; ctx.fillRect(p.x - 16, p.y - 20, 32, 40);
    ctx.fillStyle = "white"; ctx.fillRect(p.x + 4, p.y - 12, 6, 6);
    ctx.fillStyle = "black"; ctx.fillRect(p.x + 7, p.y - 10, 3, 3);
    ctx.fillStyle = "white"; ctx.font = "bold 14px Arial"; ctx.textAlign = "center";
    ctx.fillText(p.name, p.x, p.y - 26);
  }
}

function drawVictory() {
  ctx.fillStyle = "rgba(0,0,0,0.85)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.shadowColor = "rgba(0,255,150,0.5)";
  ctx.shadowBlur = 20;
  ctx.fillStyle = "#2ecc71";
  ctx.font = "bold 80px Arial";
  ctx.textAlign = "center";
  ctx.fillText("¡NIVEL COMPLETADO!", 600, 250);
  ctx.shadowBlur = 0;

  function drawButton(text, x, selected) {
    ctx.fillStyle = selected ? "#f1c40f" : "#34495e";
    ctx.strokeStyle = "white";
    ctx.lineWidth = 4;

    ctx.fillRect(x - 120, 350, 240, 70);
    ctx.strokeRect(x - 120, 350, 240, 70);

    ctx.fillStyle = "white";
    ctx.font = "bold 25px Arial";
    ctx.fillText(text, x, 395);
  }

  drawButton("SIGUIENTE", 450, victorySelection === 0);
  drawButton("HOME", 750, victorySelection === 1);

  ctx.fillStyle = "#f1c40f";
  ctx.font = "40px Arial";
  ctx.fillText("▲", victorySelection === 0 ? 450 : 750, 450);
}

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (currentStatus === "lobby") drawLobby();
  else if (currentStatus === "victory") drawVictory();
  else drawGame();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>

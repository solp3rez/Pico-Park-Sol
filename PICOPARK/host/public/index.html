<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PICO PARK - Host</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
      /* Estilos Generales */
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: radial-gradient(circle, #1a1a2e 0%, #16213e 100%);
        color: #fff;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }

      /* Título Estilizado */
      h1 {
        margin: 0;
        padding: 20px;
        font-size: 3rem;
        text-transform: uppercase;
        letter-spacing: 5px;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        color: #00d2ff;
      }

      /* Contenedor del QR */
      #ui-overlay {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        padding: 15px;
        border-radius: 15px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        text-align: center;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        z-index: 10;
      }

      #qrcode {
        background: white;
        padding: 10px;
        border-radius: 10px;
        display: inline-block;
      }

      #qrcode img {
        display: block;
      }

      p {
        margin-top: 10px;
        font-weight: bold;
        font-size: 0.9rem;
        color: #00d2ff;
      }

      /* Canvas del Juego */
      canvas {
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
      }

      /* Info de Jugadores */
      #stats {
        position: absolute;
        bottom: 20px;
        left: 20px;
        font-size: 1.2rem;
        background: rgba(0, 0, 0, 0.5);
        padding: 10px 20px;
        border-radius: 50px;
        border-left: 5px solid #00d2ff;
      }
    </style>
  </head>
  <body>
    <h1>PICO PARK CLONE</h1>

    <div id="ui-overlay">
      <div id="qrcode"></div>
      <p>ESCANEÁ PARA JUGAR</p>
      <div id="ip-display" style="font-size: 12px; opacity: 0.7"></div>
    </div>

    <div id="stats">Jugadores conectados: <span id="player-count">0</span></div>

    <script src="game.js"></script>

    <script>
      // Lógica para mostrar la IP en pantalla por si el QR falla
      const socket = io();
      socket.on("connect", () => {
        console.log("Conectado al servidor");
      });

      // Actualizar contador de jugadores (opcional si tu server lo envía)
      socket.on("updatePlayers", (players) => {
        const count = Object.keys(players).length;
        document.getElementById("player-count").innerText = count;
      });
    </script>
  </body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>HOST PANTALLA PRINCIPAL</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { margin: 0; background: #000; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
    canvas { border: 2px solid #333; background: #111; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  </style>
</head>
<body>

<canvas id="c"></canvas>

<script>
const socket = io();
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = 1200;
canvas.height = 600;

let gamePlayers = {};
let lobbyPlayers = [];
let currentStatus = "lobby";

// Definimos la estructura visual estática basada en el Nivel 1 de tu server.js
const LEVEL_VISUAL = {
  platforms: [
    { x: 600, y: 550, w: 1200, h: 20 },
    { x: 300, y: 420, w: 200, h: 20 },
    { x: 900, y: 420, w: 200, h: 20 },
    { x: 600, y: 300, w: 300, h: 20 }
  ],
  door: { x: 1100, y: 500, w: 50, h: 70 },
  key: { x: 600, y: 150, r: 12 }
};

socket.on("lobbyUpdate", (data) => {
  lobbyPlayers = data.players || [];
});

socket.on("gameStarted", () => {
  console.log("-> ¡El juego comenzó oficialmente!");
  currentStatus = "playing";
});

socket.on("gameState", (state) => {
  gamePlayers = state.players || {};
});

function sendStartSignal() {
  if (lobbyPlayers.length < 1) {
    alert("Se necesitan mínimo 1 jugador conectado");
    return;
  }
  socket.emit("startGame");
}

canvas.addEventListener("click", (e) => {
  if (currentStatus !== "lobby") return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  if (x >= 450 && x <= 750 && y >= 450 && y <= 530) {
    sendStartSignal();
  }
});

window.addEventListener("keydown", (e) => {
  if (currentStatus === "lobby" && (e.code === "Space" || e.code === "Enter")) {
    sendStartSignal();
  }
});

function drawLobby() {
  ctx.fillStyle = "#0d0d1a";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "white";
  ctx.font = "bold 40px Arial";
  ctx.fillText("PICO PARK - MULTIPLAYER", 50, 70);

  ctx.font = "24px Arial";
  ctx.fillText("Esperando jugadores...", 50, 110);
  ctx.fillText(`Jugadores en sala: ${lobbyPlayers.length}/4`, 50, 160);

  lobbyPlayers.forEach((player, index) => {
    const y = 220 + index * 70;
    ctx.fillStyle = player.color;
    ctx.fillRect(50, y, 45, 45);

    ctx.fillStyle = "white";
    ctx.font = "24px Arial";
    ctx.fillText(player.name, 120, y + 32);
  });

  ctx.fillStyle = lobbyPlayers.length >= 1 ? "#2ecc71" : "#555";
  ctx.fillRect(450, 450, 300, 80);

  ctx.fillStyle = "white";
  ctx.font = "bold 28px Arial";
  ctx.fillText("START GAME", 510, 498);

  if (lobbyPlayers.length < 1) {
    ctx.fillStyle = "#ff4444";
    ctx.font = "18px Arial";
    ctx.fillText("⚠️ Conectá la App del Celu para habilitar el inicio", 380, 560);
  }
}

// NUEVA FUNCIÓN CORREGIDA: Ahora dibuja los obstáculos reales de Matter.js
function drawGame() {
  // Fondo de la partida
  ctx.fillStyle = "#161623";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 1. DIBUJAR LA PUERTA DE SALIDA (Marrón con marco dorado)
  ctx.fillStyle = "#8e44ad";
  ctx.fillRect(LEVEL_VISUAL.door.x - 25, LEVEL_VISUAL.door.y - 35, LEVEL_VISUAL.door.w, LEVEL_VISUAL.door.h);
  ctx.strokeStyle = "#f1c40f";
  ctx.lineWidth = 3;
  ctx.strokeRect(LEVEL_VISUAL.door.x - 25, LEVEL_VISUAL.door.y - 35, LEVEL_VISUAL.door.w, LEVEL_VISUAL.door.h);

  // 2. DIBUJAR LA LLAVE FLOTANTE (Círculo Dorado)
  ctx.beginPath();
  ctx.arc(LEVEL_VISUAL.key.x, LEVEL_VISUAL.key.y, LEVEL_VISUAL.key.r, 0, 2 * Math.PI);
  ctx.fillStyle = "#f1c40f";
  ctx.fill();
  ctx.closePath();

  // 3. DIBUJAR LAS PLATAFORMAS FLOTANTES DE TU SERVER
  ctx.fillStyle = "#4a5568";
  LEVEL_VISUAL.platforms.forEach(p => {
    // Matter.js posiciona desde el centro, por eso restamos la mitad del ancho/alto
    ctx.fillRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h);
  });

  // 4. DIBUJAR A LOS JUGADORES (Los Gatitos)
  for (let id in gamePlayers) {
    const p = gamePlayers[id];
    // Cuerpo del personaje
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 16, p.y - 20, 32, 40);

    // Ojos de los gatitos para que tengan onda
    ctx.fillStyle = "white";
    ctx.fillRect(p.x + 4, p.y - 12, 6, 6);
    ctx.fillStyle = "black";
    ctx.fillRect(p.x + 7, p.y - 10, 3, 3);

    // Nombre del jugador arriba
    ctx.fillStyle = "white";
    ctx.font = "bold 14px Arial";
    ctx.textAlign = "center";
    ctx.fillText(p.name, p.x, p.y - 26);
  }
}

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (currentStatus === "lobby") {
    drawLobby();
  } else {
    drawGame();
  }

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>

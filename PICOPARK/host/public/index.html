<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>HOST PANTALLA PRINCIPAL</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { margin: 0; background: #000; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
    canvas { border: 2px solid #333; background: #111; }
  </style>
</head>
<body>

<canvas id="c"></canvas>

<script>
const socket = io();
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = 1200;
canvas.height = 600;

let gamePlayers = {};
let lobbyPlayers = [];
let currentStatus = "lobby";

socket.on("lobbyUpdate", (data) => {
  lobbyPlayers = data.players;
});

socket.on("gameStarted", () => {
  currentStatus = "playing";
});

socket.on("gameState", (state) => {
  gamePlayers = state.players;
});

function drawLobby() {
  ctx.fillStyle = "#1a1a2e";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#fff";
  ctx.font = "bold 40px sans-serif";
  ctx.fillText("PICO-LOBBY", 50, 80);
  ctx.font = "20px sans-serif";
  ctx.fillText("Esperando jugadores...", 50, 120);

  lobbyPlayers.forEach((p, i) => {
    ctx.fillStyle = p.color;
    ctx.fillRect(50, 180 + i * 60, 40, 40);
    ctx.fillStyle = "#fff";
    ctx.font = "24px sans-serif";
    ctx.fillText(p.name, 110, 210 + i * 60);
  });

  // Botón Start interactivo en pantalla para el Host
  ctx.fillStyle = "#2ecc71";
  ctx.fillRect(500, 450, 200, 60);
  ctx.fillStyle = "white";
  ctx.font = "bold 24px sans-serif";
  ctx.fillText("START GAME", 525, 488);
}

// Click del Host en su propia pantalla
canvas.addEventListener("click", (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  if (currentStatus === "lobby" && x > 500 && x < 700 && y > 450 && y < 510) {
    socket.emit("input", { key: "start", pressed: true });
  }
});

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (currentStatus === "lobby") {
    drawLobby();
  } else {
    // Dibujar Escenario / Plataforma piso base
    ctx.fillStyle = "#333";
    ctx.fillRect(0, 560, 1200, 40); 

    // Dibujar Jugadores Activos
    for (let id in gamePlayers) {
      let p = gamePlayers[id];
      ctx.fillStyle = p.color;
      // Centramos el dibujo del canvas restando mitad de ancho/alto (32x40)
      ctx.fillRect(p.x - 16, p.y - 20, 32, 40);
      
      // Nombre arriba del cuadrado
      ctx.fillStyle = "white";
      ctx.font = "14px sans-serif";
      ctx.fillText(p.name, p.x - 20, p.y - 28);
    }
  }

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
